---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
spec:
  chartRef:
    kind: OCIRepository
    name: cilium
  interval: 1h
  values:
    ipam:
      mode: kubernetes

    k8sServiceHost: 127.0.0.1
    k8sServicePort: 7445

    cgroup:
      autoMount:
        enabled: false
      hostRoot: /sys/fs/cgroup

    kubeProxyReplacement: true
    kubeProxyReplacementHealthzBindAddr: 0.0.0.0:10256
    socketLB:
      enabled: true
      hostNamespaceOnly: true

    ipv4:
      enabled: true
    ipv6:
      enabled: false
    k8s:
      requireIPv4PodCIDR: true
      requireIPv6PodCIDR: false

    routingMode: tunnel
    tunnelProtocol: vxlan
    autoDirectNodeRoutes: false
    endpointRoutes:
      enabled: false

    encryption:
      enabled: true
      type: wireguard
      nodeEncryption: true
      wireguard:
        persistentKeepalive: 25s

    bpf:
      masquerade: true
      hostLegacyRouting: true

    l2announcements:
      enabled: false
    loadBalancer:
      algorithm: maglev
      mode: snat

    # CNI
    cni:
      exclusive: false

    envoy:
      enabled: false
    gatewayAPI:
      enabled: false

    # Observability
    hubble:
      enabled: false
      relay:
        enabled: false
      ui:
        enabled: false
      metrics:
        enabled:
          - dns
          - drop
          - tcp
          - flow
          - port-distribution
          - icmp
          - "httpV2:exemplars=true;labelsContext=source_namespace,source_workload,destination_namespace,destination_workload,traffic_direction"
          - "policy:sourceContext=app|workload-name|pod|reserved-identity;destinationContext=app|workload-name|pod|dns|reserved-identity;labelsContext=source_namespace,destination_namespace"

    prometheus:
      enabled: true
      serviceMonitor:
        enabled: true
        trustCRDsExist: true

    operator:
      replicas: 2
      rollOutPods: true
      dashboards:
        enabled: true
      prometheus:
        enabled: true
        serviceMonitor:
          enabled: true

    dashboards:
      enabled: true
    rollOutCiliumPods: true

    securityContext:
      capabilities:
        ciliumAgent:
          - CHOWN
          - KILL
          - NET_ADMIN
          - NET_RAW
          - IPC_LOCK
          - SYS_ADMIN
          - SYS_RESOURCE
          - PERFMON
          - BPF
          - DAC_OVERRIDE
          - FOWNER
          - SETGID
          - SETUID
        cleanCiliumState:
          - NET_ADMIN
          - SYS_ADMIN
          - SYS_RESOURCE